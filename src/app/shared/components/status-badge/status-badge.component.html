<span
  class="badge"
  [ngClass]="{
    'bg-warning text-dark':
      (type === 'status' && value === 'Pending') ||
      (type === 'priority' && value === 'Medium'),

    'bg-info text-dark':
      (type === 'status' && value === 'In Progress') ||
      (type === 'priority' && value === 'Low'),

    'bg-success': type === 'status' && value === 'Completed',

    'bg-danger': type === 'priority' && value === 'High',
  }"
>
  {{ value }}
</span>
