<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Task List</h2>
    <button class="btn btn-primary" routerLink="/tasks/add">Add Task</button>
  </div>

  <div *ngIf="loading" class="alert alert-info">Loading tasks...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Search by title"
        (input)="onSearch($any($event.target).value)"
      />
    </div>

    <div class="col-md-4">
      <select
        class="form-select"
        (change)="onAssigneeFilter($any($event.target).value)"
      >
        <option value="">All Assignees</option>
        <option *ngFor="let user of users$ | async" [value]="user.id">
          {{ user.name }}
        </option>
      </select>
    </div>

    <div class="col-md-4">
      <select
        class="form-select"
        (change)="onCreatedByFilter($any($event.target).value)"
      >
        <option value="">CreatedBy</option>
        <option *ngFor="let admin of admins$ | async" [value]="admin.id">
          {{ admin.name }}
        </option>
      </select>
    </div>

    <div class="col-md-4">
      <select
        class="form-select"
        (change)="onStatusFilter($any($event.target).value)"
      >
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>
  </div>

  <ng-container *ngIf="vm$ | async as vm">
    <app-shared-table
      [columns]="columns"
      [data]="vm.data"
      (sort)="onSort($event)"
      (rowClick)="navigateToDetails($event.id)"
      (edit)="handleEdit($event)"
      (delete)="handleDelete($event)"
    >
    </app-shared-table>
    <div class="mt-3" *ngIf="vm.data.length === 0">
      <div class="alert alert-warning mb-0">No tasks found.</div>
    </div>

    <ngb-pagination
      class="d-flex justify-content-end mt-3"
      [collectionSize]="vm.total"
      [page]="vm.page"
      [pageSize]="vm.pageSize"
      (pageChange)="onPageChange($event)"
    >
    </ngb-pagination>
  </ng-container>
</div>
