<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">{{ isEditMode ? 'Edit Task' : 'Create Task' }}</h3>

      <button *ngIf="isEditMode" type="button" class="btn btn-outline-danger" (click)="onDelete()">
        <i class="bi bi-trash"></i> Delete Task
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">

        <!-- Title -->
        <app-form-field 
          label="Title" 
          [control]="taskForm.get('title')" 
          errorMessage="Title is required (min 3 chars).">
          <input type="text" formControlName="title" class="form-control"
            [class.is-invalid]="taskForm.get('title')?.touched && taskForm.get('title')?.invalid">
        </app-form-field>

        <!-- Description -->
        <app-form-field 
          label="Description" 
          [control]="taskForm.get('description')" 
          errorMessage="Description is required.">
          <textarea formControlName="description" class="form-control" rows="3"></textarea>
        </app-form-field>

        <div class="row">
          <!-- Assignee -->
          <div class="col-md-6">
            <app-form-field label="Assigned To" [control]="taskForm.get('assignedTo')">
              <select formControlName="assignedTo" class="form-select">
                <option [ngValue]="null">Select User</option>
                <option *ngFor="let user of users" [value]="user.id">{{ user.name }}</option>
              </select>
            </app-form-field>
          </div>

          <!-- Priority -->
          <div class="col-md-3">
            <app-form-field label="Priority" [control]="taskForm.get('priority')">
              <select formControlName="priority" class="form-select">
                <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
              </select>
            </app-form-field>
          </div>

          <!-- Status -->
          <div class="col-md-3">
            <app-form-field label="Status" [control]="taskForm.get('status')">
              <select formControlName="status" class="form-select">
                <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
              </select>
            </app-form-field>
          </div>
        </div>

        <div class="row">
          <!-- Start Date -->
          <div class="col-md-6">
            <app-form-field label="Start Date" [control]="taskForm.get('startDate')">
              <input type="date" formControlName="startDate" class="form-control"
                [class.is-invalid]="taskForm.hasError('gapTooSmall')">
            </app-form-field>
          </div>

          <!-- Due Date -->
          <div class="col-md-6">
            <app-form-field label="Due Date" [control]="taskForm.get('dueDate')">
              <input type="date" formControlName="dueDate" class="form-control"
                [class.is-invalid]="taskForm.hasError('gapTooSmall')">
            </app-form-field>
          </div>
        </div>

        <!-- Group Level Validation (Keep outside as it targets the group, not a specific control) -->
        <div *ngIf="taskForm.hasError('gapTooSmall') && (taskForm.get('dueDate')?.touched)"
          class="text-danger text-center container mt-2 small">
          The Due Date must be at least 2 days after the Start Date.
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="button" class="btn btn-light" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">
            {{ isEditMode ? 'Save Changes' : 'Create Task' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
